              - heading "How I work" [level=2] [ref=e343]
              - paragraph [ref=e344]: "Most engagements run the same five beats. What changes is how long each one takes: a two-week audit compresses them into ten days, a year of product work loops through them a dozen times."
              - list [ref=e345]:
                - listitem [ref=e346]:
                  - paragraph [ref=e347]: "01"
                  - generic [ref=e348]:
                    - heading "Kickoff" [level=3] [ref=e349]
                    - paragraph [ref=e350]: "One conversation about the business before anything about the interface: what the product has to do, who it is losing today, and what has to be true in six months for this to have been worth it. I leave with the goal we are designing against and the constraints I have to design inside."
                - listitem [ref=e351]:
                  - paragraph [ref=e352]: "02"
                  - generic [ref=e353]:
                    - heading "Research" [level=3] [ref=e354]
                    - paragraph [ref=e355]: "I talk to the people who actually use the thing, and read what the product already knows: support threads, session recordings, the last three attempts at this. It is usually a week, and it is the cheapest week in the project, because most of what it produces is a list of things not to build."
                - listitem [ref=e356]:
                  - paragraph [ref=e357]: "03"
                  - generic [ref=e358]:
                    - heading "Directions" [level=3] [ref=e359]
                    - paragraph [ref=e360]: You see work inside the first two weeks and it is deliberately unfinished. Two or three directions that disagree with each other, so the decision is about which problem we are solving rather than which shade of blue. Polish is cheap once the direction is right and expensive before.
                - listitem [ref=e361]:
                  - paragraph [ref=e362]: "04"
                  - generic [ref=e363]:
                    - heading "Prototype" [level=3] [ref=e364]
                    - paragraph [ref=e365]: "Once a direction holds I build it: real components, real data, real states. A working interaction settles questions a static mockup can only argue about, which is how the empty state, the error and the timing get designed instead of discovered in QA."
                - listitem [ref=e366]:
                  - paragraph [ref=e367]: "05"
                  - generic [ref=e368]:
                    - heading "Ship" [level=3] [ref=e369]
                    - paragraph [ref=e370]: I stay through implementation, reviewing builds, fixing what only shows up on a real device, and leaving your engineers components and rules they can keep building on. The engagement ends when the work is in production, not when the file is tidy.
              - paragraph [ref=e371]: That is a default, not a template. Reviews happen when there is something worth reviewing rather than because it is Thursday, and I would rather show you something rough on Tuesday than something finished next month.
          - region [ref=e372]:
            - generic [ref=e373]:
              - heading "Services" [level=2] [ref=e374]
              - paragraph [ref=e375]: I take on a small number of client projects alongside my own product work. Three shapes, chosen by how much of the problem is still open when we start.
              - list [ref=e376]:
                - listitem [ref=e377]:
                  - paragraph [ref=e378]: 0 → 1
                  - generic [ref=e379]:
                    - heading "End-to-end product design" [level=3] [ref=e380]
                    - paragraph [ref=e381]: "One designer owning the problem from the first user interview to the shipped screen: discovery, research, UX and UI, and the coded prototypes your engineers build against. The shape of the Matcha rebuild and of BoldVoice."
                - listitem [ref=e382]:
                  - paragraph [ref=e383]: Monthly
                  - generic [ref=e384]:
                    - heading "Fractional to full-time design partner" [level=3] [ref=e385]
                    - paragraph [ref=e386]: A standing seat on a team with no in-house designer, a few days a week or full time when the roadmap needs it. New surfaces as they come up, review on what your engineers are already building, and a design system that keeps its shape between the two.
                - listitem [ref=e387]:
                  - paragraph [ref=e388]: 1 – 2 weeks
                  - generic [ref=e389]:
                    - heading "Design sprint and UX audit" [level=3] [ref=e390]
                    - paragraph [ref=e391]: Fixed scope, fixed date. I talk to your users, take apart the product you have today, and come back with a ranked list of what it is costing you and a direction for each one.
              - generic [ref=e392]:
                - heading "Common questions" [level=3] [ref=e393]
                - list [ref=e394]:
                  - listitem [ref=e395]:
                    - heading "What does it cost?" [level=4] [ref=e396]
                    - paragraph [ref=e397]: Engagements are billed by the week or by the month, not by the deliverable. We start by estimating the scope and how long it will take, and the total follows from that. If you would rather have one number to approve, I quote the whole scope as a single figure and you pay it monthly across a timeline we set before the work starts. Tell me what you are building and roughly when you need it, and I will come back with both.
                  - listitem [ref=e398]:
                    - heading "How long does it take?" [level=4] [ref=e399]
                    - paragraph [ref=e400]: A sprint or audit runs one to two weeks and ends on a date we agree before it starts. End-to-end product work is measured in months, and how many depends on how much is still open at kickoff. You get that number in the proposal, not in a conversation after we have started.
                  - listitem [ref=e401]:
                    - heading "Do you write code as well?" [level=4] [ref=e402]
                    - paragraph [ref=e403]: "Yes. I studied computer science and shipped front-end full time for years before I moved into design: React, TypeScript, the CSS and the motion. What is different now is a swarm of agents behind a tight end-to-end suite, which is what lets one person carry the work from the first sketch to production. This site is mine end to end. Your backend is not, and I work next to the engineers who own it."
                  - listitem [ref=e404]:
                    - heading "What do you need from me?" [level=4] [ref=e405]
                    - paragraph [ref=e406]: "One person who can make decisions, access to the people who use the product, and about an hour a week. You do not need a spec written first: working out what to build is most of what you would be hiring me for."
                  - listitem [ref=e407]:
                    - heading "How do we work day to day?" [level=4] [ref=e408]
                    - paragraph [ref=e409]: A shared Slack or Telegram channel, and reviews when there is something worth reviewing instead of a standing meeting. I am on Atlantic time in Punta Cana, which covers the US East Coast almost exactly and most of the European afternoon.

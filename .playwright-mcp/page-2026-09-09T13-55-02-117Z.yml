                  - generic [aria-hidden]: Matcha Pro
                  - generic [ref=e215]: I led the product structure and interaction design for Matcha Pro, a decentralized trading workspace for active traders. Live charts, token signals, transactions, and order management come together in a denser layout, giving advanced tools a dedicated home alongside Matcha’s standard swap experience.

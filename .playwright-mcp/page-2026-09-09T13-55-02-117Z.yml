            - region [aria-hidden] [ref=e296]:
              - generic [ref=e297]:
                - heading [level=2] [ref=e298]: How I work
                - paragraph [ref=e299]: "Most engagements run the same five beats. What changes is how long each one takes: a two-week audit compresses them into ten days, a year of product work loops through them a dozen times."
                - list [ref=e300]:
                  - listitem [ref=e301]:
                    - paragraph [ref=e302]: "01"
                    - generic [ref=e303]:
                      - heading [level=3] [ref=e304]: Kickoff
                      - paragraph [ref=e305]: "One conversation about the business before anything about the interface: what the product has to do, who it is losing today, and what has to be true in six months for this to have been worth it. I leave with the goal we are designing against and the constraints I have to design inside."
                  - listitem [ref=e306]:
                    - paragraph [ref=e307]: "02"
                    - generic [ref=e308]:
                      - heading [level=3] [ref=e309]: Research
                      - paragraph [ref=e310]: "I talk to the people who actually use the thing, and read what the product already knows: support threads, session recordings, the last three attempts at this. It is usually a week, and it is the cheapest week in the project, because most of what it produces is a list of things not to build."
                  - listitem [ref=e311]:
                    - paragraph [ref=e312]: "03"
                    - generic [ref=e313]:
                      - heading [level=3] [ref=e314]: Directions
                      - paragraph [ref=e315]: You see work inside the first two weeks and it is deliberately unfinished. Two or three directions that disagree with each other, so the decision is about which problem we are solving rather than which shade of blue. Polish is cheap once the direction is right and expensive before.
                  - listitem [ref=e316]:
                    - paragraph [ref=e317]: "04"
                    - generic [ref=e318]:
                      - heading [level=3] [ref=e319]: Prototype
                      - paragraph [ref=e320]: "Once a direction holds I build it: real components, real data, real states. A working interaction settles questions a static mockup can only argue about, which is how the empty state, the error and the timing get designed instead of discovered in QA."
                  - listitem [ref=e321]:
                    - paragraph [ref=e322]: "05"
                    - generic [ref=e323]:
                      - heading [level=3] [ref=e324]: Ship
                      - paragraph [ref=e325]: I stay through implementation, reviewing builds, fixing what only shows up on a real device, and leaving your engineers components and rules they can keep building on. The engagement ends when the work is in production, not when the file is tidy.
                - paragraph [ref=e326]: That is a default, not a template. Reviews happen when there is something worth reviewing rather than because it is Thursday, and I would rather show you something rough on Tuesday than something finished next month.
            - region [ref=e327]:
              - generic [ref=e328]:
                - heading [level=2] [aria-hidden] [ref=e329]: Services
                - paragraph [aria-hidden] [ref=e330]: I take on a small number of client projects alongside my own product work. Three shapes, chosen by how much of the problem is still open when we start.
                - list [aria-hidden] [ref=e331]:
                  - listitem [ref=e332]:
                    - paragraph [ref=e333]: 0 → 1
                    - generic [ref=e334]:
                      - heading [level=3] [ref=e335]: End-to-end product design
                      - paragraph [ref=e336]: "One designer owning the problem from the first user interview to the shipped screen: discovery, research, UX and UI, and the coded prototypes your engineers build against. The shape of the Matcha rebuild and of BoldVoice."
                  - listitem [ref=e337]:
                    - paragraph [ref=e338]: Monthly
                    - generic [ref=e339]:
                      - heading [level=3] [ref=e340]: Fractional to full-time design partner
                      - paragraph [ref=e341]: A standing seat on a team with no in-house designer, a few days a week or full time when the roadmap needs it. New surfaces as they come up, review on what your engineers are already building, and a design system that keeps its shape between the two.
                  - listitem [ref=e342]:
                    - paragraph [ref=e343]: 1 – 2 weeks
                    - generic [ref=e344]:
                      - heading [level=3] [ref=e345]: Design sprint and UX audit
                      - paragraph [ref=e346]: Fixed scope, fixed date. I talk to your users, take apart the product you have today, and come back with a ranked list of what it is costing you and a direction for each one.
                - generic [aria-hidden] [ref=e347]:
                  - heading [level=3] [ref=e348]: Common questions
                  - list [ref=e349]:
                    - listitem [ref=e350]:
                      - heading [level=4] [ref=e351]: What does it cost?
                      - paragraph [ref=e352]: Every engagement is priced to its scope, so there is no rate card here. Tell me what you are building and roughly when you need it, and I will come back with a number and a timeline. Fixed-scope work is quoted as a single figure, and the standing partnership is billed monthly.
                    - listitem [ref=e353]:
                      - heading [level=4] [ref=e354]: How long does it take?
                      - paragraph [ref=e355]: A sprint or audit runs one to two weeks and ends on a date we agree before it starts. End-to-end product work is measured in months, and how many depends on how much is still open at kickoff. You get that number in the proposal, not in a conversation after we have started.
                    - listitem [ref=e356]:
                      - heading [level=4] [ref=e357]: Do you write code as well?
                      - paragraph [ref=e358]: "Yes. I studied computer science and shipped front-end full time for years before I moved into design: React, TypeScript, the CSS and the motion. What is different now is a swarm of agents behind a tight end-to-end suite, which is what lets one person carry the work from the first sketch to production. This site is mine end to end. Your backend is not, and I work next to the engineers who own it."
                    - listitem [ref=e359]:
                      - heading [level=4] [ref=e360]: What do you need from me?
                      - paragraph [ref=e361]: "One person who can make decisions, access to the people who use the product, and about an hour a week. You do not need a spec written first: working out what to build is most of what you would be hiring me for."
                    - listitem [ref=e362]:
                      - heading [level=4] [ref=e363]: How do we work day to day?
                      - paragraph [ref=e364]: A shared Slack or Telegram channel, and reviews when there is something worth reviewing instead of a standing meeting. I am on Atlantic time in Punta Cana, which covers the US East Coast almost exactly and most of the European afternoon.

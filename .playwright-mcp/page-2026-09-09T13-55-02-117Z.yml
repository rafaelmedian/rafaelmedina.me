              - generic [aria-hidden] [ref=e86]:
                - link [ref=e88] [cursor=pointer]:
                  - /url: /work/matcha-multiwallet-flow/
                  - generic [aria-hidden]: Matcha multiwallet flow
                  - generic [ref=e90]: I mapped and designed Matcha’s multiwallet flow, bringing connected wallets and network details into one menu for the decentralized trading platform. I covered wallet selection, adding a wallet, and loading, empty, and error states, so people can switch wallets during a trade without losing their quote or inputs.
                - link [ref=e92] [cursor=pointer]:
                  - /url: /work/matcha-homepage/
                  - generic [aria-hidden]: Matcha homepage
                  - generic [ref=e94]: I redesigned the homepage for Matcha, the decentralized trading platform by 0x, around the ways people begin a visit. I led the page structure and content hierarchy, giving new and returning users direct paths to search for a token, browse the market, connect a wallet, and start trading.
                - button [expanded] [ref=e96] [cursor=pointer]:
                  - generic [aria-hidden] [ref=e97]:
                    - generic [ref=e99]:
                      - strong [ref=e100]: My project context is moving into Markdown
                      - generic [ref=e101]:
                        - text: I've found myself creating more Markdown files lately. Things I would have put in Linear, or kept beside a design system in Figma, are ending up in files called
                        - code [ref=e102]: PROJECT_STATUS.md
                        - text: and
                        - code [ref=e103]: DESIGN_QA.md
                        - text: . It wasn't a big decision to change my workflow. I just kept needing somewhere to put information that both I and an agent could use.
                      - generic [ref=e104]: A task needs a little history. A design decision needs a reason. A bug needs an explanation of what should have happened. When those details are scattered across tools, I become the person carrying them between places. The files started as a way to do less of that.
                      - generic [ref=e105]: What interests me is how ordinary the solution is. A heading, a few sentences, a list of things that still need attention. Enough context to pick up the work without reconstructing the whole conversation first.
                    - generic [ref=e107]:
                      - strong [ref=e108]: AI design needs more control
                      - generic [ref=e109]: Claude-only web design is wild when you already have a Figma design in front of you. There is very little mystery about what you want. You can see the layout, the spacing, the way the pieces belong together. Getting the code to arrive at that same place can still take a surprising amount of back and forth.
                      - generic [ref=e110]: "I described it on X as three stretches: the first 60% flies, the next 30% takes ages of saying 'no, not like that,' and the final 10% feels like god mode. Those numbers describe the feeling, not a benchmark. The strange part is how quickly the experience swings from impressive to frustrating and back again."
                      - generic [ref=e111]: Once the structure is right, changes can feel almost instant. Before that, even a small request can turn into another round of explaining the layout. That middle stretch is where I keep getting stuck.
                    - generic [ref=e113]:
                      - strong [ref=e114]: Building it yourself still costs something
                      - generic [ref=e115]: "Whenever someone says you can just build a tool yourself now, I have two reactions. The first is excitement, because more of those ideas are becoming possible. The second is a small accounting question: what are we including in the cost?"
                      - generic [ref=e116]: In a draft reply, I listed tokens, time, and running costs. It was a fairly ordinary objection to a very exciting possibility. Being able to make the thing doesn't settle whether I want to be responsible for it.
                      - generic [ref=e117]: I think the decision will keep moving. Something that is too expensive or frustrating to build today might become a reasonable afternoon project later. Something that looks cheap in a demo might become a surprisingly demanding part of your week.
                  - generic [ref=e118]: Writings & notes

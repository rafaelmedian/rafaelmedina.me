                  - generic [aria-hidden]: Shared family stories
                  - generic [ref=e192]: I designed the story feed, moment detail view, and commenting patterns for a private family memory app. Stories group photos and clips by period, with dates, comments, and likes attached to each moment, so families can browse their memories and keep the conversation with the story it belongs to.
                - link [ref=e194] [cursor=pointer]:
                  - /url: /work/dealership-lead-hub/
                  - generic [aria-hidden]: Dealership lead hub
                  - generic [ref=e196]: I designed a lead hub for a dealership retention platform, helping staff find sales and service opportunities in their existing customer base. I owned the layout, outreach metrics, retention comparisons, filters, and bulk-send flow, so staff can see how outreach performed and send a filtered batch of customers to the dealer app without leaving the page.
                - link [ref=e198] [cursor=pointer]:
                  - /url: /work/matcha-token-page/
                  - generic [aria-hidden]: Matcha token page
                  - generic [ref=e199]: I led the page structure and interactions for token research and trading on Matcha, the decentralized trading platform by 0x. The page brings market data, charts, trade controls, and order history together, so people can review a token and start a trade without changing views.
                - link [ref=e201] [cursor=pointer]:
                  - /url: /work/matcha-rewards/
                  - generic [aria-hidden]: Matcha Rewards
                  - generic [ref=e205]: I designed the campaign artwork and variants for Matcha’s weekly rewards program on its decentralized trading platform. The key visual puts the leaderboard, cash prizes, trades, referrals, and points behind the headline, giving the launch, weekly countdown posts, and link previews one shared visual system.
              - generic [aria-hidden] [ref=e206]:
                - link [ref=e208] [cursor=pointer]:
                  - /url: /work/matcha-on-mobile/
                  - generic [aria-hidden]: Matcha on mobile
                  - generic [ref=e209]: I led the mobile trade journey for Matcha, the decentralized trading platform by 0x. I adapted token details, the trade form, review, and confirmation for phone screens, including the layout, touch targets, and order of information, so people can research and trade from a mobile browser.
                - link [ref=e211] [cursor=pointer]:
                  - /url: /work/matcha-trade-page/
                  - generic [aria-hidden]: Matcha trade page
                  - generic [ref=e212]: I defined the information hierarchy and interactions for Matcha’s main trading workspace. It brings the live quote, chart, balances, open orders, and trade history into one layout, so people can place a decentralized trade and follow its activity from the same page.
                - link [ref=e214] [cursor=pointer]:

"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

# This is a Vite app: the dev server transforms `src/*.tsx` on the fly and maps
# `public/` onto the URL root. A plain static file server cannot do either, so
# it serves raw TypeScript and 404s every asset under `/Projects/`.
[scripts]
setup = "npm install"
run_mode = "concurrent"

[scripts.run.dev]
command = "npm run dev -- --port $CONDUCTOR_PORT --host 127.0.0.1"
default = true
icon = "play"

# Serves the real build output, including the prerender step, for checking
# anything the dev server does not exercise.
[scripts.run.preview]
command = "npm run build && npx vite preview --port $CONDUCTOR_PORT --host 127.0.0.1"
icon = "globe"

# Run `npm run test:e2e` from a terminal with E2E_PORT and LIKES_API_URL set
# to unused preview and API ports when another workspace is testing.
# Playwright refuses to reuse existing servers, keeping each run isolated.

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Opt in before the prerendered page can paint. Without JavaScript the
      // document remains readable; shared links and history skip the ceremony.
      if (location.pathname === "/" && !location.hash
        && !new URLSearchParams(location.search).has("project")
        && !new URLSearchParams(location.search).has("writing")
        && !matchMedia("(prefers-reduced-motion: reduce)").matches
        && performance.getEntriesByType("navigation")[0]?.type !== "back_forward") {
        document.documentElement.dataset.avatarIntro = "pending";
        // A stalled portrait must never strand the reader. Only a pending intro:
        // one that started late still gets to finish its reveal.
        setTimeout(() => {
          if (document.documentElement.dataset.avatarIntro === "pending") {
            delete document.documentElement.dataset.avatarIntro;
          }
        }, 4000);
      }
      // scripts/hero-first.mjs calls this on the home page, whose hero carries its
      // own CSS. A visit with the intro gets the full stylesheet without blocking,
      // so the hero never waits for it. Any other visit opens on content that
      // needs it, and keeps an ordinary blocking stylesheet.
      window.loadPageStyles = (href) => {
        const root = document.documentElement;
        if (!root.dataset.avatarIntro) {
          document.write("<link rel=stylesheet crossorigin href=" + JSON.stringify(href) + ">");
          addEventListener("DOMContentLoaded", restorePosters);
          return;
        }
        root.dataset.pageStyles = "pending";
        window.pageStylesReady = new Promise((resolve) => {
          const link = document.createElement("link");
          link.rel = "stylesheet";
          link.crossOrigin = "";
          link.href = href;
          link.onload = link.onerror = resolve;
          document.head.append(link);
        }).then(() => {
          delete root.dataset.pageStyles;
          if (document.readyState === "loading") addEventListener("DOMContentLoaded", restorePosters);
          else restorePosters();
        });
      };
      function restorePosters() {
        for (const video of document.querySelectorAll("video[data-poster]")) video.poster = video.dataset.poster;
      }
      // Runs from here, not the bundle, so it needs nothing but the HTML. Without
      // prerendered markup (the dev server) there is no portrait until
      // useAvatarIntro mounts and starts it.
      window.startAvatarIntro = () => {
        const root = document.documentElement;
        const portrait = document.querySelector(".mosaic-avatar-face-front .mosaic-avatar-portrait");
        if (window.avatarIntroStarted || root.dataset.avatarIntro !== "pending" || !portrait) return;
        window.avatarIntroStarted = true;

        const motion = matchMedia("(prefers-reduced-motion: reduce)");
        const style = getComputedStyle(portrait);
        const milliseconds = (name) => {
          const value = style.getPropertyValue(name);
          return parseFloat(value) * (/ms\s*$/.test(value) ? 1 : 1000) || 0;
        };
        // The same properties the stylesheet's delays use, so a beat cannot end
        // before what it holds has landed.
        const revealDuration = milliseconds("--duration-slow");
        const tilesDelay = milliseconds("--avatar-intro-tiles-delay");
        let timer;
        const end = () => {
          clearTimeout(timer);
          delete root.dataset.avatarIntro;
        };
        // Changes of intent or geometry end the intro immediately. Never fight a
        // scroll, keyboard navigation, a resized viewport, or a motion preference.
        for (const type of ["resize", "scroll", "keydown", "pointerdown", "pagehide"]) {
          addEventListener(type, end, { passive: true });
        }
        motion.addEventListener("change", end);

        const wait = (duration) => new Promise((resolve) => { timer = setTimeout(resolve, duration); });
        const still = (phase) => root.dataset.avatarIntro === phase;
        // The face, then the top section, then the tiles: those wait for their
        // stylesheet however long it takes, and arrive as skeletons if their
        // artwork has not.
        portrait.decode().then(async () => {
          if (!still("pending")) return;
          root.dataset.avatarIntro = "portrait";
          await wait(revealDuration);
          if (!still("portrait")) return;
          root.dataset.avatarIntro = "revealing";
          await Promise.all([wait(tilesDelay), window.pageStylesReady]);
          if (!still("revealing")) return;
          root.dataset.avatarIntro = "tiles";
          await wait(revealDuration);
          if (still("tiles")) end();
        }).catch(end);
      };
      if (document.documentElement.dataset.avatarIntro) {
        // The hero is whole once the parser reaches the grid after it.
        const parsing = new MutationObserver(() => {
          if (document.getElementById("work")) {
            parsing.disconnect();
            window.startAvatarIntro();
          }
        });
        parsing.observe(document, { childList: true, subtree: true });
      }
      // A project, the résumé, the notes, or a note: the prerendered article is
      // for crawlers and a visit without JavaScript. Hold it back so a shared
      // link opens straight into its dialog; see src/lib/galleryEntry.ts.
      if (/^\/(?:work\/[^/]+|resume|notes(?:\/[^/]+)?)\/?$/.test(location.pathname)) {
        document.documentElement.dataset.galleryEntry = "pending";
        setTimeout(() => {
          if (document.documentElement.dataset.galleryEntry === "pending") {
            delete document.documentElement.dataset.galleryEntry;
          }
        }, 4000);
      }
    </script>

    <!-- gtag.js is injected at runtime by src/lib/analytics.ts, so the connection
         can't be discovered from the markup. -->
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />
    <!-- Handlee is only referenced from the @font-face in src/styles/fonts.css, which
         the browser can't see until the stylesheet parses. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Handlee-core.woff2" crossorigin />
    <!-- The first mosaic row paints three tiles; all are LCP candidates. -->
    <link rel="preload" as="image" href="/Projects/shot-small-9-poster.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/Projects/shot-small-16-poster.webp" type="image/webp" fetchpriority="high" />

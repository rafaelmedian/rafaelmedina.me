name: Deploy

# The site goes live from here. Pushing to main is the only way to deploy;
# nothing is hand-copied into a branch any more.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Opt in after the one-time Cloudflare setup. Deploy before the site so
      # newly published note IDs are already accepted by the API.
      - name: Update portfolio API
        if: vars.VITE_LIKES_API_URL != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::The portfolio API is enabled; add the Cloudflare secrets described in README.md."
            exit 1
          fi
          npm run likes:migrate:remote
          npm run likes:deploy

      # Vite inlines this at build time. Unset means the analytics code is
      # tree-shaken away and nothing is tracked.
      - run: npm run build
        env:
          VITE_LIKES_API_URL: ${{ vars.VITE_LIKES_API_URL }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}

      - name: Check the custom domain survived the build
        run: |
          if [ "$(cat dist/CNAME)" != "rafaelmedina.me" ]; then
            echo "::error::dist/CNAME is missing or wrong — the custom domain would break."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

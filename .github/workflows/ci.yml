name: CI

on:
  pull_request:
    branches: [main]

# Only the newest revision of a PR is useful. Cancelling older revisions keeps
# them from occupying runners while the author is already waiting on new work.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.classify.outputs.runtime }}
    steps:
      - id: classify
        name: Check whether the site can change
        uses: actions/github-script@v8
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            })
            const rootDocs = new Set([
              "AGENTS.md",
              "CLAUDE.md",
              "PROJECT_STATUS.md",
              "README.md",
              "vercel-design-guidelines.md",
            ])
            const documentationOnly = files.every(({ filename }) =>
              filename.startsWith("docs/") || rootDocs.has(filename)
            )
            core.setOutput("runtime", String(!documentationOnly))

  e2e:
    name: E2E (shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1/3
            artifact: 1
          - shard: 2/3
            artifact: 2
          - shard: 3/3
            artifact: 3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Vite inlines this at build time, so the e2e build — not the preview
      # server — is where the local worker URL has to be set.
      - run: npm run build
        env:
          VITE_LIKES_API_URL: http://127.0.0.1:8787

      - name: Install Playwright browser
        run: |
          # Playwright downloads its own Chromium. The runner's unrelated
          # Chrome apt source can fail with a repository hash mismatch.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npx playwright test --shard=${{ matrix.shard }}

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-e2e-${{ matrix.artifact }}
          path: test-results/
          retention-days: 7

  checks:
    name: Static and design-system checks
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run likes:check
      - run: npm run contact:check
      - run: npm run contact:test
      - run: npm run test:about-intro

      - name: Install Playwright browser
        run: |
          # Playwright downloads its own Chromium. The runner's unrelated
          # Chrome apt source can fail with a repository hash mismatch.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium

      # `/design-system` is dev-only, so this suite needs its own Vite dev
      # server rather than either shard's production preview server.
      - name: Run design-system tests
        run: npm run test:design-system

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-design-system
          path: test-results-design-system/
          retention-days: 7

  # Keep the repository's existing required `verify` check stable while the
  # work behind it runs in parallel. It also gives docs-only PRs a real success
  # result instead of leaving a path-filtered required check pending forever.
  verify:
    needs: [changes, e2e, checks]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable check
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUNTIME: ${{ needs.changes.outputs.runtime }}
          E2E_RESULT: ${{ needs.e2e.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          test "$CHANGES_RESULT" = "success"

          if [ "$RUNTIME" != "true" ]; then
            echo "Documentation-only change; runtime checks are not needed."
            exit 0
          fi

          test "$E2E_RESULT" = "success"
          test "$CHECKS_RESULT" = "success"
